    <rect x="-70" y="90" width="140" height="170" rx="18" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/><rect x="150" y="90" width="140" height="170" rx="18" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/><rect x="370" y="90" width="140" height="170" rx="18" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/><rect x="590" y="90" width="140" height="170" rx="18" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/><rect x="810" y="90" width="140" height="170" rx="18" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/>

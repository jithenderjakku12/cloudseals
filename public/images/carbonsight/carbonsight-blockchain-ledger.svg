<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">


    <defs>
      <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#070B19"/>
        <stop offset="55%" stop-color="#0B1640"/>
        <stop offset="100%" stop-color="#0F2A5C"/>
      </linearGradient>
      <radialGradient id="orbCyan" cx="25%" cy="15%" r="60%">
        <stop offset="0%" stop-color="#4fc8ff" stop-opacity="0.35"/>
        <stop offset="65%" stop-color="#4fc8ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbOrange" cx="85%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#ff7a4e" stop-opacity="0.26"/>
        <stop offset="65%" stop-color="#ff7a4e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbViolet" cx="65%" cy="90%" r="70%">
        <stop offset="0%" stop-color="#b26eff" stop-opacity="0.22"/>
        <stop offset="70%" stop-color="#b26eff" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
<rect width="1200" height="800" fill="url(#bg5)"/>
<rect width="1200" height="800" fill="url(#orbOrange)"/>

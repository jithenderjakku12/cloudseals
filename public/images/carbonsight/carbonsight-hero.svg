<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">


    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#070B19"/>
        <stop offset="55%" stop-color="#0B1640"/>
        <stop offset="100%" stop-color="#0F2A5C"/>
      </linearGradient>
      <radialGradient id="orbCyan" cx="25%" cy="15%" r="60%">
        <stop offset="0%" stop-color="#4fc8ff" stop-opacity="0.35"/>
        <stop offset="65%" stop-color="#4fc8ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbOrange" cx="85%" cy="25%" r="60%">
        <stop offset="0%" stop-color="#ff7a4e" stop-opacity="0.26"/>
        <stop offset="65%" stop-color="#ff7a4e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbViolet" cx="65%" cy="90%" r="70%">
        <stop offset="0%" stop-color="#b26eff" stop-opacity="0.22"/>
        <stop offset="70%" stop-color="#b26eff" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#orbCyan)"/>
<rect width="1600" height="900" fill="url(#orbOrange)"/>
<rect width="1600" height="900" fill="url(#orbViolet)"/>

<!-- grid -->
<g opacity="0.12">
  <line x1="0" y1="0" x2="0" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="80" y1="0" x2="80" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="160" y1="0" x2="160" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="320" y1="0" x2="320" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="400" y1="0" x2="400" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="560" y1="0" x2="560" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="640" y1="0" x2="640" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="800" y1="0" x2="800" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="880" y1="0" x2="880" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="960" y1="0" x2="960" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1040" y1="0" x2="1040" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1120" y1="0" x2="1120" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1200" y1="0" x2="1200" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1280" y1="0" x2="1280" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1360" y1="0" x2="1360" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1440" y1="0" x2="1440" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1520" y1="0" x2="1520" y2="900" stroke="#ffffff" stroke-width="1"/><line x1="1600" y1="0" x2="1600" y2="900" stroke="#ffffff" stroke-width="1"/>
  <line x1="0" y1="0" x2="1600" y2="0" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="80" x2="1600" y2="80" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="160" x2="1600" y2="160" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="240" x2="1600" y2="240" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="320" x2="1600" y2="320" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="400" x2="1600" y2="400" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="480" x2="1600" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="560" x2="1600" y2="560" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="640" x2="1600" y2="640" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="720" x2="1600" y2="720" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="800" x2="1600" y2="800" stroke="#ffffff" stroke-width="1"/><line x1="0" y1="880" x2="1600" y2="880" stroke="#ffffff" stroke-width="1"/>
</g>

<!-- earth disk -->
<g transform="translate(1040 260)">
  <circle cx="0" cy="0" r="220" fill="#071023" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="0" cy="0" r="220" fill="url(#orbCyan)"/>
  <circle cx="0" cy="0" r="220" fill="url(#orbViolet)"/>
  <path d="M -180 -20 C -110 -120, -40 -120, 30 -60 C 90 -10, 160 20, 190 90 C 120 120, 40 140, -40 120 C -130 90, -210 50, -180 -20 Z"
        fill="rgba(79,200,255,0.24)"/>
  <path d="M -130 70 C -70 30, 40 40, 120 110 C 70 150, -20 160, -100 120 C -140 100, -160 90, -130 70 Z"
        fill="rgba(255,122,78,0.18)"/>
  <!-- satellite -->
  <g filter="url(#softGlow)" transform="translate(-260 -230) rotate(-18)">
    <rect x="210" y="155" width="110" height="60" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.22)"/>
    <rect x="160" y="150" width="50" height="70" rx="10" fill="rgba(79,200,255,0.22)" stroke="rgba(79,200,255,0.35)"/>
    <rect x="320" y="150" width="50" height="70" rx="10" fill="rgba(178,110,255,0.18)" stroke="rgba(178,110,255,0.35)"/>
    <circle cx="265" cy="185" r="10" fill="#ff7a4e" opacity="0.9"/>
    <line x1="265" y1="215" x2="265" y2="265" stroke="rgba(79,200,255,0.55)" stroke-width="3"/>
    <path d="M 265 265 C 240 330, 260 360, 320 390" fill="none" stroke="rgba(79,200,255,0.35)" stroke-width="3"/>
  </g>
</g>

<!-- ledger ribbon -->
<g transform="translate(140 600)">
  <rect x="0" y="0" width="760" height="150" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
  <g transform="translate(26 26)">
    <rect x="0" y="0" width="120" height="98" rx="16" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.14)"/>
    <path d="M 26 64 L 56 34 L 86 64" fill="none" stroke="#4fc8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="34" r="10" fill="#b26eff"/>
    <circle cx="26" cy="64" r="10" fill="#ff7a4e"/>
    <circle cx="86" cy="64" r="10" fill="#4fc8ff"/>

    <g transform="translate(150 6)">
      <rect x="0" y="0" width="560" height="28" rx="12" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="40" width="520" height="22" rx="11" fill="rgba(255,255,255,0.05)"/>
      <rect x="0" y="72" width="480" height="22" rx="11" fill="rgba(255,255,255,0.05)"/>
    </g>
  </g>
</g>

<!-- accent dots -->
<g opacity="0.85">
  <circle cx="210" cy="220" r="6" fill="#4fc8ff"/>
  <circle cx="250" cy="250" r="4" fill="#b26eff"/>
  <circle cx="300" cy="210" r="5" fill="#ff7a4e"/>
</g>

</svg>